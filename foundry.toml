# ── OPTIMIZER: UNIFORM runs=200 FOR EVERY CONTRACT ───────────────────────────
# Set globally at 200 (Architect, 2026-07-20). 200 is the standard balance:
# small enough that DEPLOYMENT stays affordable — these are TEMPLATES launched
# by many customers, each paying deploy gas on a large (~24 KB) contract, so
# per-deploy cost is a real, recurring price that feeds the customer's price —
# and high enough that RUNTIME gas on the hot paths (V4 swap hooks, payment
# settlement) stays reasonable.
#
# Why UNIFORM instead of per-contract tuning: the previous
# compilation_restrictions (payments/x402 → 10000, L1 → 800) could NOT include
# the V3 hook. The hook is co-imported with restricted siblings across the test
# graph, and forge rejects that as "incompatible settings restrictions" — the
# hook's compilation unit can't satisfy two per-contract rules at once. A single
# global setting removes that whole class of conflict AND keeps every deploy
# cheaper than the old 10000 presets did.
#
# DEPLOY-COST NOTE (for the templates-launched-many-times economics): the
# optimizer setting moves bytecode only marginally (~100 B between runs=1 and
# 200 on the hook — lower runs = smaller = cheaper deploy, but a rounding error
# here). The dominant per-customer deploy-cost lever is the contract SIZE and
# the LAUNCH ARCHITECTURE (prewired factory / minimal-proxy clones so customers
# deploy a tiny proxy, not the full 24 KB each time) — tracked separately.
# ────────────────────────────────────────────────────────────────────────────

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true  # SymmetryGuardCore.t.sol shells to script/gen_proof.py via vm.ffi
fs_permissions = [
  { access = "read", path = "./test/fixtures" },       # vm.etch CreateX runtime for the offline salt-pool CREATE3 test
  { access = "write", path = "./public/artifacts" },   # script/GenTemplateArtifact.s.sol writes the pinned launch-rail template
]

remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    # hookmate ships a node_modules-relative forge-std remapping that doesn't
    # exist in a submodule checkout — pin forge-std to v4-core's vendored copy.
    "forge-std/=lib/v4-core/lib/forge-std/src/"
]

# (Per-contract compilation_restrictions removed — every contract now compiles
# at the uniform global runs=200. See the header for why uniform beats
# per-contract here. deploy/optimizer_pool.json's per-contract presets are
# superseded by this single setting.)
