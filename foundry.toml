# ── OPTIMIZER: HARDCODED PER CONTRACT (part of the POSSESSIO service) ─────────
# We preset the optimizer for every contract. Customers never choose it and
# don't need to know why — the runs are baked in here via per-contract
# compilation_restrictions, so ONE `forge build` produces every contract at
# its correct, fixed setting automatically. This is a service we perform for
# them, not a decision we expose.
#
# Global default = runs=1 (size-safe; the v2.6.3 hook REQUIRES it to fit
# under the 24,576-byte EIP-170 wall). Restrictions below pin the contracts
# that differ, and only those:
#   payments, x402Core → 10000  (small + called constantly → cheap runtime)
#   L1 anchor set      → 800     (Ethereum — balance expensive deploy vs run)
#
# Needs a recent Foundry (foundryup). If your version rejects `optimizer_runs`
# inside a restriction, replace it with:
#     min_optimizer_runs = <n>
#     max_optimizer_runs = <n>
# deploy/optimizer_pool.json is the human-readable record of these presets +
# the codehash sync target.
# ────────────────────────────────────────────────────────────────────────────

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
via_ir = true
ffi = true  # SymmetryGuardCore.t.sol shells to script/gen_proof.py via vm.ffi
fs_permissions = [{ access = "read", path = "./test/fixtures" }]  # vm.etch CreateX runtime for the offline salt-pool CREATE3 test

remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    # hookmate ships a node_modules-relative forge-std remapping that doesn't
    # exist in a submodule checkout — pin forge-std to v4-core's vendored copy.
    "forge-std/=lib/v4-core/lib/forge-std/src/"
]

# Foundry 1.x requires a compiler profile to exist that satisfies each
# compilation restriction below — these declare the runs=10000 / runs=800
# variants the restrictions select.
additional_compiler_profiles = [
    { name = "runs-10000", optimizer_runs = 10000 },
    { name = "runs-800", optimizer_runs = 800 },
]

# Hardcoded per-contract optimizer presets (only contracts that differ from
# the runs=1 default are listed; everything else is size-safe at 1).
[[profile.default.compilation_restrictions]]
paths = "src/PossessioPayments.sol"
optimizer_runs = 10000

[[profile.default.compilation_restrictions]]
paths = "src/PossessioX402Core.sol"
optimizer_runs = 10000

[[profile.default.compilation_restrictions]]
paths = "src/L1AnchorFactory.sol"
optimizer_runs = 800

[[profile.default.compilation_restrictions]]
paths = "src/L1Anchor.sol"
optimizer_runs = 800
