# ── OPTIMIZER POOL ──────────────────────────────────────────────────────────
# Per-(contract, chain) optimizer settings. Each profile writes to its OWN out
# dir so artifacts at different runs never overwrite each other — the "pool"
# holds every contract's bytecode at its chosen setting. deploy/sync_optimizer_
# pool.sh compiles each and records codehashes into public/optimizer_pool.json.
#
#   default : runs=1     — size-first / rarely-called (deployability). The
#                          v2.6.3 hook REQUIRES this to fit under the 24KB wall.
#   hot     : runs=10000 — small + called constantly (payments, x402Core) —
#                          cheap runtime forever, pay a little more to deploy.
#   l1      : runs=800    — Ethereum, where deploy AND runtime are both
#                          expensive — a balance, not an extreme.
# ────────────────────────────────────────────────────────────────────────────

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
via_ir = true
ffi = true  # SymmetryGuardCore.t.sol shells to script/gen_proof.py via vm.ffi
fs_permissions = [{ access = "read", path = "./test/fixtures" }]  # vm.etch CreateX runtime for the offline salt-pool CREATE3 test

remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/"
]

[profile.hot]
src = "src"
out = "out-hot"
libs = ["lib"]
optimizer = true
optimizer_runs = 10000
via_ir = true
remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/"
]

[profile.l1]
src = "src"
out = "out-l1"
libs = ["lib"]
optimizer = true
optimizer_runs = 800
via_ir = true
remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/"
]
