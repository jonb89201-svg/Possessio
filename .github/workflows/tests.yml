# THE SUITE, RUN WHERE IT CAN ACTUALLY RUN.
#
# WHY THIS EXISTS. The repo's primary language is Solidity and its primary suite
# is 54 .t.sol files, and until now NOTHING ran them automatically. Verification
# depended on the Architect remembering to run `forge test` in his own terminal.
#
# It cannot be done from a Claude Code web session at all: measured 2026-08-01,
# this environment's egress policy returns 403 for both api.github.com and
# github.com, so foundryup cannot resolve a release tag or download a binary.
# A seat working here reasons from the diff and calls it verified — which
# happened, and is recorded in laws/PHYSICS_of_execution.md.
#
# A GitHub Actions runner is not behind that policy. So the suite runs here,
# on every pull request, before the merge that deploys.
#
# COST: zero. The repository is public, so Actions minutes are unmetered. That
# matters — the protocol runs on a fixed monthly infrastructure budget, and an
# execution seat cannot perceive cost (PHYSICS_of_execution, constant 7).
#
# THE GATE THIS CREATES: on this repo, merging to main IS a production deploy
# (console-deploy.yml fires on public/** and worker/**). A required check here
# turns "someone remembered to test" into something that refuses.

name: tests

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger, so a run can be requested rather than only push-driven.
  #
  # OBSERVED: this workflow has produced zero runs, and there are zero
  # pull_request runs across 1,409 runs in this repository, while `schedule` and
  # hand-merged `push` runs work normally.
  #
  # NOT DIAGNOSED. This seat first wrote that as GitHub's app-token recursion
  # guard — plausible, consistent with the evidence, and NOT ISOLATED. The
  # Architect offered a simpler cause: the push credential is being reset. Same
  # observable, different root cause, and the second is testable by fixing the
  # token and pushing again.
  #
  # The claim is left open on purpose. A plausible story that fits the evidence
  # is not a measurement, and this one was about to harden into a fact in a
  # comment because it read well.
  workflow_dispatch:

# A second push to the same PR makes the first run obsolete; do not pay for it
# or wait on it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The Solidity suite. Deterministic and BLOCKING. ──────────────────
  forge:
    name: forge (solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. lib/ is six git submodules (openzeppelin, v4-core,
          # v4-periphery, chainlink, base-std, hookmate). Without this the
          # build fails at import resolution before a single test runs.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge version
        run: forge --version

      - name: build
        run: forge build

      # No BASE_RPC_URL is set here ON PURPOSE. The fork suites gate on
      # vm.envOr("BASE_RPC_URL", "") and skip cleanly when it is unset, so this
      # job is deterministic. Pointing it at a public RPC would make the
      # BLOCKING gate flaky, and a flaky gate teaches people to ignore it —
      # the same failure mode as a permanently red suite.
      - name: test
        run: forge test -vv

  # ── The keeper suite. Also blocking, and much faster. ────────────────
  keeper:
    name: keeper (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm ci --ignore-scripts`, not `npm install`. Both halves are load-bearing.
      #
      # --ignore-scripts closes the preinstall/postinstall execution vector. That
      # is the exact mechanism of the ChainDrop npm worm (disclosed 2026-08-04,
      # 868 packages across 1381 versions, ~2B monthly downloads): a compromised
      # maintainer account added `"preinstall": "node setup.mjs"`, which ran
      # automatically on install and exfiltrated GitHub PATs and workflow tokens,
      # npm tokens, cloud credentials and the COMPLETE process environment. This
      # job runs with GITHUB_TOKEN in scope, so an install-time script here is
      # code execution against the repository's own credentials.
      #
      # `ci` instead of `install` pins the tree to the lockfile exactly, so a
      # transitive dependency cannot silently resolve to a newer, compromised
      # patch version between one run and the next.
      #
      # MEASURED before adopting, not assumed: this repo has 8 packages with
      # install-time scripts, all native-build or prepare hooks
      # (utf-8-validate, bufferutil, bigint-buffer, @solana/buffer-layout*,
      # node-fetch, uuid). With scripts off, bigint-buffer falls back to pure JS
      # exactly as its own script says it will, every direct dependency loads,
      # and the full suite passes 75/75 exit 0. Nothing here needs to execute at
      # install time.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  # ── Credential scan. BLOCKING, and the only layer that cannot be skipped. ──
  #
  # .githooks/pre-commit runs the same scan locally, but a hook is not
  # enforcement: it is absent in a fresh clone, `--no-verify` skips it, and an
  # agent committing from a container may never have configured it. This job is
  # the boundary that holds.
  #
  # It matters more than an ordinary lint because the failure is IRREVERSIBLE.
  # A secret in a commit stays in history, in every fork, and in caches after a
  # force-push. Private visibility does not help — private is an access-control
  # setting, not a property of the data. Catching it here is the last cheap
  # moment; after the merge the only remedy is rotation.
  scrub:
    name: scrub (credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No npm install: tools/scrub.mjs is dependency-free on purpose, so the
      # gate cannot be taken down by a registry outage or a bad lockfile.
      - run: node tools/scrub.mjs --check

  # ── Fork coverage. NON-BLOCKING by design. ───────────────────────────
  # These hit live Base mainnet, so they can fail for reasons that have nothing
  # to do with the diff — an RPC hiccup is not a defect in the code. Kept off
  # the blocking path so it can never wedge a merge, but reported so the
  # coverage is visible rather than silently absent.
  #
  # Runs only when the secret exists. Without it the fork suites skip, and this
  # job says so instead of pretending it ran them.
  fork:
    name: fork (live base, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: test (fork)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          if [ -z "${BASE_RPC_URL:-}" ]; then
            echo "BASE_RPC_URL is not set — the fork suites SKIP."
            echo "This job did not verify any fork path. Set the secret to enable it."
            exit 0
          fi
          forge test -vv --match-path 'test/*Fork*.t.sol'
