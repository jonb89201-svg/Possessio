name: radar-refresh

# Auto-redeploys possessio-radar every 3 hours. Originally a mitigation for
# the 15s sub-tick loop stall (removed in b5b32ff — single-pass scan now);
# kept as a safety redeploy + on-demand deploy from the Actions tab
# (workflow_dispatch).
#
# REQUIRES: a repo Actions secret named CLOUDFLARE_API_TOKEN.
# GOTCHA: GitHub runs scheduled workflows ONLY from the default branch (main).
# Deploys main — the radar dev branch merged in PR #14; deploying the frozen
# dev branch here was silently reverting every later merge to main.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm ci ONLY — the committed radar/package-lock.json is the reviewed
      # supply chain. The old `|| npm install` fallback silently re-resolved
      # every dependency range on each scheduled deploy (AUDIT R-2); if ci
      # fails now, the deploy fails loudly, which is the point.
      - name: Install radar deps
        working-directory: radar
        run: npm ci
      # Diagnostic preflight: prints token LENGTH and Cloudflare's verify
      # verdict — never the value. API tokens are 40 chars; the Global API
      # Key (wrong kind for wrangler) is 37 hex chars.
      - name: Token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RAW=${#CLOUDFLARE_API_TOKEN}
          TRIM=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | wc -c)
          echo "token length: raw=$RAW trimmed=$TRIM (API token=40, Global API Key=37)"
          curl -s -o /tmp/verify.json -w "verify HTTP status: %{http_code}\n" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          cat /tmp/verify.json; echo
      - name: Deploy radar worker
        working-directory: radar
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
